[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "hkid-utils"
dynamic = ["version"]
description = "Validate, calculate check digits for, and format Hong Kong identity card numbers"
readme = "README-Python.md"
requires-python = ">=3.11"
license = "MIT"

[project.urls]
Repository = "https://github.com/Wal-N/hkid"

[tool.maturin]
bindings = "pyo3"
