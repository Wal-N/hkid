name: Rust CI

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "python/Cargo.toml"
      - "rust-toolchain.toml"
      - "rust/**"
      - "data/**"
      - "conformance/**"
      - "LICENSE"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "python/Cargo.toml"
      - "rust-toolchain.toml"
      - "rust/**"
      - "data/**"
      - "conformance/**"
      - "LICENSE"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build workspace documentation
        run: cargo doc --workspace --no-deps --locked
      - name: Run tests on glibc Linux
        run: |
          getconf GNU_LIBC_VERSION
          cargo test --locked
      - name: Build and test the packaged crate
        run: |
          cargo package --locked
          mkdir "$RUNNER_TEMP/hkid-package"
          tar -xzf target/package/hkid-utils-*.crate -C "$RUNNER_TEMP/hkid-package" --strip-components=1
          cargo test --locked --manifest-path "$RUNNER_TEMP/hkid-package/Cargo.toml"
      - name: Run README examples with only the packaged crate as a dependency
        run: |
          consumer="$RUNNER_TEMP/hkid-readme"
          cargo new --lib --vcs none --edition 2024 "$consumer"
          cargo add --offline --manifest-path "$consumer/Cargo.toml" --path "$RUNNER_TEMP/hkid-package"
          echo '#![doc = include_str!("../../hkid-package/rust/README.md")]' > "$consumer/src/lib.rs"
          cargo test --locked --offline --doc --manifest-path "$consumer/Cargo.toml"
      - name: Test the packaged crate with custom name weights
        run: |
          package="$RUNNER_TEMP/hkid-package"
          cp "$package/rust/tests/fixtures/weighted-name-seed.csv" "$package/data/chinese-name-seed.csv"
          cargo test --locked --offline --lib --manifest-path "$package/Cargo.toml"
      - name: Test holder summaries with a misclassified symbol
        run: |
          package="$RUNNER_TEMP/hkid-package"
          consumer="$RUNNER_TEMP/hkid-readme"
          symbols="$package/data/hkid-symbols.json"
          jq '(.symbols[] | select(.id == "RIGHT_OF_ABODE") | .category) = "REPORTED_PLACE_OF_BIRTH"' "$symbols" > "$symbols.tmp"
          mv "$symbols.tmp" "$symbols"
          mkdir -p "$consumer/tests"
          cp "$package/rust/tests/fixtures/misclassified_holder_symbol.rs" "$consumer/tests/"
          cargo test --locked --offline --manifest-path "$consumer/Cargo.toml" --test misclassified_holder_symbol

  browser:
    name: Browser WASM (Firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install WASM target and matching test runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rustup target add wasm32-unknown-unknown
          package=$(cargo pkgid --locked wasm-bindgen)
          version=${package##*@}
          bundle="wasm-bindgen-$version-x86_64-unknown-linux-musl"
          cd "$RUNNER_TEMP"
          gh release download "$version" --repo wasm-bindgen/wasm-bindgen \
            --pattern "$bundle.tar.gz" --pattern "$bundle.tar.gz.sha256sum"
          checksum=$(cut -d ' ' -f 1 "$bundle.tar.gz.sha256sum")
          echo "$checksum  $bundle.tar.gz" | sha256sum --check
          tar -xzf "$bundle.tar.gz" "$bundle/wasm-bindgen-test-runner"
          echo "$RUNNER_TEMP/$bundle" >> "$GITHUB_PATH"
      - name: Test local dates and language in headless Firefox
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          WASM_BINDGEN_TEST_WEBDRIVER_JSON: ${{ github.workspace }}/rust/tests/browser-webdriver.json
          TZ: Pacific/Kiritimati
        run: |
          firefox --version
          GECKODRIVER="$(command -v geckodriver)" cargo test --locked --target wasm32-unknown-unknown --test card_browser
