name: Rust CI

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rust/**"
      - "data/**"
      - "conformance/**"
      - "LICENSE"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rust/**"
      - "data/**"
      - "conformance/**"
      - "LICENSE"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked
      - name: Build and test the packaged crate
        run: |
          cargo package --locked
          mkdir "$RUNNER_TEMP/hkid-package"
          tar -xzf target/package/hkid-utils-*.crate -C "$RUNNER_TEMP/hkid-package" --strip-components=1
          cargo test --locked --manifest-path "$RUNNER_TEMP/hkid-package/Cargo.toml"
      - name: Run README examples with only the packaged crate as a dependency
        run: |
          consumer="$RUNNER_TEMP/hkid-readme"
          cargo new --lib --vcs none --edition 2024 "$consumer"
          cargo add --offline --manifest-path "$consumer/Cargo.toml" --path "$RUNNER_TEMP/hkid-package"
          echo '#![doc = include_str!("../../hkid-package/rust/README.md")]' > "$consumer/src/lib.rs"
          cargo test --locked --offline --doc --manifest-path "$consumer/Cargo.toml"
